<article class="article">
    <span class="article__category">
        @@article-category
    </span>
    <h3 class="h3 article__title">
        <a href="./blog/@@article-link" target="_blank">@@article-title</a>
    </h3>
    <p class="article__desc">
        @@article-desc
    </p>
    <a href="./blog/@@article-link" target="_blank" class="article__read link link-dark link-hover">
        Read article
    </a>
</article>
